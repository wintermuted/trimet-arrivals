name: Verify React migration

on:
  push:
    branches: [wintermuted-react-package-migration]
    paths: [.github/workflows/verify-react-migration.yml]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NX_LOAD_DOT_ENV_FILES: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          registry-url: https://registry.npmjs.org
      - name: Record input identity
        run: |
          mkdir migration-artifacts
          node <<'NODE'
          const fs = require('node:fs');
          const cp = require('node:child_process');
          const crypto = require('node:crypto');
          const files = cp.execFileSync('git', ['ls-files', '-z'], { encoding: 'utf8' }).split('\0').filter(Boolean);
          const hashes = Object.fromEntries(files.map(file => [file, crypto.createHash('sha256').update(fs.readFileSync(file)).digest('hex')]));
          fs.writeFileSync('migration-artifacts/input-identity.json', JSON.stringify({ commit: process.env.GITHUB_SHA, hashes }, null, 2));
          NODE
      - name: Resolve published packages
        run: npm install --package-lock-only --ignore-scripts --registry=https://registry.npmjs.org --prefer-online --fetch-retries=1 --fetch-timeout=30000
      - name: Verify public package identity and preserve lockfile
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          for (const [name, integrity] of [
            ['ui-react', 'sha512-ePqJKsAerXoRbGFZrhslfGFR7AVhVrYzyLlCxu2DG97MlKBc/zlUtkQgIlnJ38HAJtpbMW61eIltYYGtEaShrg=='],
            ['ui-theme', 'sha512-4TiSf8VIrdCwBZrMcQUtYlwmlnbMPWpH6ByHfKMxbt1AybkYyuxXdQx5hzsZOrqELPcT+P7SA3ZxCYroGlyANg==']
          ]) {
            const entry = lock.packages[`node_modules/@wintermuted/${name}`];
            assert.equal(entry.version, '1.0.0');
            assert.equal(entry.integrity, integrity);
            assert.equal(entry.resolved, `https://registry.npmjs.org/@wintermuted/${name}/-/${name}-1.0.0.tgz`);
          }
          fs.copyFileSync('package-lock.json', 'migration-artifacts/package-lock.json');
          NODE
      - name: Install registry-resolved dependencies
        run: npm ci --registry=https://registry.npmjs.org --fetch-retries=1 --fetch-timeout=30000
      - name: Test migrated application and shared UI behavior
        run: npm test -- --project ui --project ui-package --maxWorkers=1 --reporter=default --reporter=json --outputFile=migration-artifacts/test-results.json
      - name: Preserve migration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-migration
          path: migration-artifacts/
          if-no-files-found: error
