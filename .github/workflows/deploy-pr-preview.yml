name: Deploy PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  deploy-preview:
    runs-on: ubuntu-latest
    env:
      # Let Vite load its own mode-specific environment files.
      NX_LOAD_DOT_ENV_FILES: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test tarball bootstrap safety
        run: npm run test:bootstrap-ui

      - name: Lint app and workspace packages
        run: npm run lint

      - name: Test app and workspace packages with coverage
        id: coverage
        run: npm run test:coverage -- --maxWorkers=1

      - name: Generate coverage badge and job summary
        run: npm run coverage:report

      - name: Capture coverage artifact
        if: ${{ always() && !cancelled() && steps.coverage.outcome != 'skipped' }}
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          if-no-files-found: error

      - name: Test place data refresh and coverage reporting
        run: npx nx run-many -t test:places-data,test:coverage-report

      - name: Typecheck
        run: npx nx run-many -t typecheck

      - name: Build for PR preview
        env:
          PUBLIC_URL: /${{ github.event.repository.name }}/pr-${{ github.event.pull_request.number }}
        run: npx nx run-many -t build

      - name: Include coverage in PR preview
        run: mkdir -p build/coverage && cp -R coverage/. build/coverage/

      - name: Validate Storybook assertion dependency tree
        run: npm ls @testing-library/jest-dom --all

      - name: Typecheck Storybook
        run: npm run typecheck:storybook

      - name: Build Storybook for PR preview
        run: npm run build:storybook

      - name: Include Storybook in PR preview
        run: mkdir -p build/storybook && cp -R packages/presentation/storybook/storybook-static/. build/storybook/

      - name: Verify Storybook preview files
        run: test -s build/storybook/index.html && test -s build/storybook/iframe.html && test -s build/storybook/index.json

      - name: Deploy to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          destination_dir: pr-${{ github.event.pull_request.number }}
          keep_files: true

      - name: Comment PR
        uses: actions/github-script@v7
        with:
          script: |
            const prNumber = context.issue.number;
            const previewUrl = `https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-${prNumber}/`;
            
            const body = `🚀 Preview deployment ready!\n\nView your changes at: ${previewUrl}\n\n[Storybook component library](${previewUrl}storybook/)\n\n[Coverage report](${previewUrl}coverage/)\n\nThis preview will be automatically cleaned up when the PR is closed.`;
            
            // Find existing comment
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: prNumber,
            });
            
            const botComment = comments.find(comment => 
              comment.user.type === 'Bot' && 
              comment.body.includes('Preview deployment ready!')
            );
            
            if (botComment) {
              // Update existing comment
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: botComment.id,
                body: body
              });
            } else {
              // Create new comment
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: prNumber,
                body: body
              });
            }
