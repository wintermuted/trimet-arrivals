name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish to the live site (main or master only)
        type: boolean
        default: false

permissions:
  contents: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # Let Vite load its own mode-specific environment files.
      NX_LOAD_DOT_ENV_FILES: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Test app components and unit tests
        run: npx nx run-many -t test:ui,test:unit --outputStyle=stream

      - name: Test place data refresh
        run: npx nx run-many -t test:places-data

      - name: Test workspace packages
        run: npx nx run-many -t test:package --outputStyle=stream

      - name: Typecheck
        run: npx nx run-many -t typecheck

      - name: Build
        env:
          PUBLIC_URL: /${{ github.event.repository.name }}
        run: npx nx run-many -t build

      - name: Verify the production artifact
        env:
          PUBLIC_URL: /${{ github.event.repository.name }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const html = fs.readFileSync('build/index.html', 'utf8');
          const base = `${process.env.PUBLIC_URL}/`;
          const paths = [...html.matchAll(/(?:src|href)="(\/[^"]+)"/g)].map((match) => match[1]);
          assert(paths.some((path) => path.startsWith(`${base}assets/`) && path.endsWith('.js')), 'Missing production JS URL');
          assert(paths.some((path) => path.startsWith(`${base}assets/`) && path.endsWith('.css')), 'Missing production CSS URL');
          for (const path of paths) {
            assert(path.startsWith(base), `Wrong production base path: ${path}`);
            assert(fs.statSync(`build/${path.slice(base.length)}`).isFile(), `Missing artifact for ${path}`);
          }
          for (const file of ['404.html', '.nojekyll', 'manifest.json', 'favicon.ico', 'data/places/cafes.json']) {
            assert(fs.statSync(`build/${file}`).isFile(), `Missing Pages file: ${file}`);
          }
          console.log(`Verified production artifact for ${base}`);
          NODE

      - name: Deploy to gh-pages
        if: ${{ (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && (github.event_name == 'push' || inputs.publish) }}
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build
          keep_files: true
